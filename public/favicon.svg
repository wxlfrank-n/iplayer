<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Listening Loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1445"/>
      <stop offset="1" stop-color="#060a24"/>
    </linearGradient>
    <linearGradient id="loop" x1="17" y1="40" x2="47" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset=".48" stop-color="#00e8c0"/>
      <stop offset="1" stop-color="#40ffff"/>
    </linearGradient>
  </defs>

  <!-- Stable brand background -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#bg)"/>

  <!-- Short robot/audio ears; deliberately chunky for 16px rendering -->
  <g fill="#f4fbff">
    <rect x="6" y="28" width="3.5" height="8" rx="1.75"/>
    <rect x="11" y="25" width="3.5" height="14" rx="1.75"/>
    <rect x="49.5" y="25" width="3.5" height="14" rx="1.75"/>
    <rect x="54.5" y="28" width="3.5" height="8" rx="1.75"/>
  </g>

  <!-- Simplified infinity/listening loop -->
  <path
    d="M32 32
       C27.8 27.1 23.8 24.7 20.3 25.6
       C16.5 26.5 14.7 29.8 15.5 33.2
       C16.3 36.8 20 38.8 23.5 37.5
       C26.5 36.4 29.1 33.5 32 32
       C34.9 30.5 37.5 27.6 40.5 26.5
       C44 25.2 47.7 27.2 48.5 30.8
       C49.3 34.2 47.5 37.5 43.7 38.4
       C40.2 39.3 36.2 36.9 32 32"
    fill="none"
    stroke="url(#loop)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
