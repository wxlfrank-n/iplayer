<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" role="img" aria-labelledby="title desc">
  <title id="title">Listening loop robot icon</title>
  <desc id="desc">A subtle robot-like audio icon with side waveform ears, waveform bars, and a cyan-green infinity loop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1445"/>
      <stop offset="1" stop-color="#060a24"/>
    </linearGradient>

    <linearGradient id="loop" x1="35" y1="94" x2="115" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88"/>
      <stop offset=".48" stop-color="#00e8c0"/>
      <stop offset="1" stop-color="#40ffff"/>
    </linearGradient>

    <linearGradient id="wave" x1="75" y1="17" x2="75" y2="133" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
  </defs>

  <!-- App-icon surface -->
  <rect x="0" y="0" width="150" height="150" rx="28" fill="url(#bg)"/>

  <!-- Top waveform / subtle robot crown -->
  <g fill="url(#wave)">
    <rect x="33" y="37" width="6" height="11" rx="3"/>
    <rect x="46" y="30" width="6" height="18" rx="3"/>
    <rect x="59" y="22" width="6" height="26" rx="3"/>
    <rect x="72" y="16" width="6" height="32" rx="3"/>
    <rect x="85" y="22" width="6" height="26" rx="3"/>
    <rect x="98" y="30" width="6" height="18" rx="3"/>
    <rect x="111" y="37" width="6" height="11" rx="3"/>
  </g>

  <!-- Side waveform ears: intentionally retained to create the subtle robot character -->
  <g fill="url(#wave)">
    <rect x="13" y="67" width="6" height="16" rx="3"/>
    <rect x="22" y="62" width="6" height="26" rx="3"/>
    <rect x="122" y="62" width="6" height="26" rx="3"/>
    <rect x="131" y="67" width="6" height="16" rx="3"/>
  </g>

  <!-- Central loop / robot face -->
  <path
    d="M75 75
       C65 64 56 59 48 61
       C39 63 35 70 36 78
       C37 87 46 93 55 90
       C63 88 69 81 75 75
       C81 69 87 62 95 60
       C104 58 113 64 114 73
       C116 82 111 90 103 92
       C94 94 85 87 75 75
       C65 86 56 93 47 91
       C39 89 34 81 36 72
       C38 63 47 57 56 60
       C64 62 70 69 75 75"
    fill="none"
    stroke="url(#loop)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom waveform -->
  <g fill="url(#wave)">
    <rect x="33" y="103" width="6" height="10" rx="3"/>
    <rect x="46" y="103" width="6" height="16" rx="3"/>
    <rect x="59" y="103" width="6" height="24" rx="3"/>
    <rect x="72" y="103" width="6" height="31" rx="3"/>
    <rect x="85" y="103" width="6" height="24" rx="3"/>
    <rect x="98" y="103" width="6" height="16" rx="3"/>
    <rect x="111" y="103" width="6" height="10" rx="3"/>
  </g>
</svg>
